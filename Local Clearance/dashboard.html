<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Clearance - Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  :root {
    --erp-blue: #2a7ab5;
    --erp-blue-light: #d6eaf8;
    --erp-header-bg: #f8f9fa;
    --erp-border: #dee2e6;
    --erp-text-muted: #6c757d;
    --erp-card-hover: #c8e0f0;
  }
  body { background: #f0f2f5; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }

  /* Top navbar */
  .top-navbar {
    background: #fff;
    border-bottom: 1px solid var(--erp-border);
    padding: 6px 16px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .top-navbar .user-info { color: var(--erp-blue); font-size: 13px; cursor: pointer; }
  .top-navbar .user-info i { margin-right: 4px; }

  /* Dashboard card */
  .lc-card {
    background: var(--erp-blue-light);
    border: 1px solid #a8cde8;
    border-radius: 6px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    width: 260px;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .lc-card:hover { background: var(--erp-card-hover); box-shadow: 0 2px 8px rgba(42,122,181,0.18); }
  .lc-card .icon-wrap { color: var(--erp-blue); font-size: 42px; line-height: 1; }
  .lc-card .info-wrap h2 { font-size: 22px; font-weight: 700; color: var(--erp-blue); margin: 0 0 4px; line-height: 1.15; }
  .lc-card .info-wrap .metrics { font-size: 12px; color: #3d7aab; margin: 0; line-height: 1.7; }
  .lc-card .info-wrap .metrics span { display: block; }

  .page-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 20px; }
</style>
</head>
<body>

<!-- Top Navbar -->
<!-- <div class="top-navbar">
  <span class="user-info"><i class="fa fa-user-circle"></i> temp user <i class="fa fa-caret-down"></i></span>
</div> -->

<div class="container-fluid p-4">
  <div class="page-title">ERP Dashboard</div>
  <div class="row g-3">

    <!-- Local Clearance Card -->
    <div class="col-auto">
      <a href="cargo-position.html" style="text-decoration:none;">
        <div class="lc-card">
          <div class="icon-wrap">
            <i class="fa fa-users"></i>
          </div>
          <div class="info-wrap">
            <h2>Local<br>Clearance</h2>
            <div class="metrics">
              <span>Active Items: <strong>473</strong></span>
              <span>Active Containers: <strong>1.03K</strong></span>
            </div>
          </div>
        </div>
      </a>
    </div>

    <!-- Placeholder cards for ERP feel -->
    <div class="col-auto">
      <div class="lc-card" style="opacity:0.55; cursor:default;">
        <div class="icon-wrap"><i class="fa fa-ship"></i></div>
        <div class="info-wrap">
          <h2>Freight<br>Management</h2>
          <div class="metrics">
            <span>Active Jobs: <strong>218</strong></span>
            <span>Pending Docs: <strong>47</strong></span>
          </div>
        </div>
      </div>
    </div>

    <div class="col-auto">
      <div class="lc-card" style="opacity:0.55; cursor:default;">
        <div class="icon-wrap"><i class="fa fa-warehouse"></i></div>
        <div class="info-wrap">
          <h2>Warehouse<br>Management</h2>
          <div class="metrics">
            <span>Active Items: <strong>862</strong></span>
            <span>Locations: <strong>104</strong></span>
          </div>
        </div>
      </div>
    </div>

    <div class="col-auto">
      <div class="lc-card" style="opacity:0.55; cursor:default;">
        <div class="icon-wrap"><i class="fa fa-file-invoice-dollar"></i></div>
        <div class="info-wrap">
          <h2>Accounts<br>Payable</h2>
          <div class="metrics">
            <span>Pending Invoices: <strong>34</strong></span>
            <span>Overdue: <strong>8</strong></span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
