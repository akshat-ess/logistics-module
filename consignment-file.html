<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Vehicle Port Consignment</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #333; font-size: 13px; }

  .topnav { background: #1a2940; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 50px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .topnav .brand { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .topnav .brand span { color: #4db8ff; }
  .topnav .nav-right { display: flex; align-items: center; gap: 16px; }
  .topnav .nav-right a { color: #cdd8e8; text-decoration: none; font-size: 13px; }
  .topnav .nav-right a:hover { color: #fff; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #4db8ff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; cursor: pointer; }

  .layout { display: flex; min-height: calc(100vh - 50px); }
  .sidebar { width: 210px; background: #1e3050; color: #cdd8e8; flex-shrink: 0; padding-top: 10px; }
  .sidebar-menu { list-style: none; }
  .sidebar-menu li a { display: flex; align-items: center; gap: 9px; padding: 10px 18px; font-size: 13px; color: #cdd8e8; text-decoration: none; transition: background .2s; border-left: 3px solid transparent; }
  .sidebar-menu li a:hover, .sidebar-menu li a.active { background: #253d5e; color: #fff; border-left-color: #4db8ff; }
  .sidebar-section { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: #7a94b0; padding: 14px 18px 5px; }

  .main { flex: 1; padding: 20px 24px; overflow: auto; }

  .page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .page-title-row h1 { font-size: 20px; font-weight: 700; color: #1a2940; }

  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 16px; border-radius: 5px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: background .15s; text-decoration: none; white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #007bff; color: #fff; }
  .btn-primary:hover { background: #0069d9; }
  .btn-success { background: #28a745; color: #fff; }
  .btn-success:hover { background: #218838; }
  .btn-secondary { background: #6c757d; color: #fff; }
  .btn-secondary:hover { background: #545b62; }

  /* CARGO DETAILS CARD */
  .cargo-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); overflow: hidden; }
  .cargo-card-header { background: #f8fafd; border-bottom: 1px solid #e2e8f0; padding: 10px 18px; display: flex; align-items: center; gap: 8px; }
  .cargo-card-header .title { font-size: 13px; font-weight: 600; color: #1a2940; }
  .refresh-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: #007bff; }

  /* DECLARANT ROW */
  .declarant-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
  .decl-group { display: flex; align-items: center; gap: 12px; }
  .decl-label { font-size: 12px; font-weight: 700; color: #1a2940; text-transform: uppercase; letter-spacing: 0.5px; }

  select, input[type="text"], input[type="date"], input[type="number"] {
    border: 1px solid #ced4da; border-radius: 4px; padding: 5px 10px; font-size: 12px; font-family: inherit; background: #fff; color: #333; outline: none; transition: border-color .2s; height: 30px;
  }
  select:focus, input:focus { border-color: #007bff; box-shadow: 0 0 0 2px rgba(0,123,255,0.15); }
  select { min-width: 160px; }

  /* TABS */
  .tabs-nav { display: flex; gap: 0; padding: 0 18px; border-bottom: 2px solid #e2e8f0; background: #fff; }
  .tab-btn { padding: 10px 20px; font-size: 13px; font-weight: 500; color: #555; background: transparent; border: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .15s, border-color .15s; white-space: nowrap; }
  .tab-btn:hover { color: #007bff; }
  .tab-btn.active { color: #007bff; border-bottom-color: #007bff; font-weight: 600; }

  /* FORM GRID */
  .tab-content { display: none; padding: 0; }
  .tab-content.active { display: block; }

  .form-section { padding: 16px 18px; }
  .scroll-indicator { display: flex; align-items: center; justify-content: space-between; padding: 4px 18px; background: #f8fafd; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
  .scroll-indicator .arrows { display: flex; gap: 6px; }
  .scroll-indicator button { background: none; border: none; font-size: 14px; cursor: pointer; color: #555; padding: 2px 6px; }
  .collapse-btn { background: none; border: none; font-size: 14px; cursor: pointer; color: #555; }

  .form-grid { display: grid; gap: 0; }
  .form-row { display: grid; border-bottom: 1px solid #f0f4fa; }
  .form-row.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .form-row.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .form-row.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .form-row.cols-5 { grid-template-columns: repeat(5, 1fr); }

  .form-cell { padding: 6px 12px 8px; border-right: 1px solid #f0f4fa; }
  .form-cell:last-child { border-right: none; }
  .form-cell label { display: block; font-size: 11px; font-weight: 600; color: #6b7a8d; margin-bottom: 4px; text-align: center; }
  .form-cell input, .form-cell select { width: 100%; }
  .form-cell .radio-group { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
  .form-cell .radio-group label { display: inline; font-size: 12px; color: #333; font-weight: 400; margin-bottom: 0; }
  .form-cell .checkbox-group { display: flex; align-items: center; justify-content: center; padding: 6px 0; }
  .form-cell .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

  /* BOTTOM SCROLL BAR */
  .bottom-scroll { display: flex; align-items: center; justify-content: space-between; padding: 5px 18px; background: #f8fafd; border-top: 1px solid #e2e8f0; }
  .bottom-scroll .arrows { display: flex; gap: 6px; }
  .bottom-scroll button { background: none; border: none; font-size: 14px; cursor: pointer; color: #555; }
  .scroll-bar-track { flex: 1; height: 8px; background: #e0e6ef; border-radius: 4px; margin: 0 12px; position: relative; cursor: pointer; }
  .scroll-bar-thumb { height: 8px; background: #888; border-radius: 4px; width: 60%; }

  /* FORM ACTIONS */
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 18px; background: #f8fafd; border-top: 1px solid #e2e8f0; }

  /* VALIDATION */
  .field-error { border-color: #dc3545 !important; }
  .error-msg { color: #dc3545; font-size: 10px; margin-top: 2px; }

  .required-star { color: #dc3545; }
</style>
</head>
<body>

<nav class="topnav">
  <div class="brand">&#9783; <span>Vehicle Clearance</div>
  <!-- <div class="nav-right">
    <a href="dashboard.html">Dashboard</a>
    <a href="cargo-position.html">Cargo Position</a>
    <div class="avatar">JD</div>
  </div> -->
</nav>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">Main Menu</div>
    <ul class="sidebar-menu">
      <li><a href="dashboard-vehicle-clearance.html"><span>🏠</span> Dashboard</a></li>
      <li><a href="cargo-position.html"><span>🚢</span> Cargo Position</a></li>
      <li><a href="consignment-file.html" class="active"><span>📄</span> Consignments</a></li>
      <li><a href="#"><span>📦</span> Inventory</a></li>
    </ul>
    <div class="sidebar-section">Reports</div>
    <ul class="sidebar-menu">
      <li><a href="#"><span>📊</span> Analytics</a></li>
      <li><a href="#"><span>🖨️</span> Print Reports</a></li>
    </ul>
  </aside>

  <main class="main">
    <div class="page-title-row">
      <h1>Add Vehicle Port Consignment</h1>
      <a href="cargo-position.html" class="btn btn-primary">View Consignments</a>
    </div>

    <div class="cargo-card">
      <!-- HEADER -->
      <div class="cargo-card-header">
        <span class="title">Cargo details</span>
        <button class="refresh-btn" title="Refresh">🔄</button>
      </div>

      <!-- DECLARANT ROW -->
      <div class="declarant-row">
        <div class="decl-group">
          <span class="decl-label">DECLARANT</span>
          <select id="declarant">
            <option value="">select...</option>
            <option>John Doe – JD001</option>
            <option>Mary Smith – MS002</option>
            <option>Peter Kamau – PK003</option>
            <option>Alice Wangari – AW004</option>
          </select>
        </div>
        <div class="decl-group">
          <span class="decl-label">PORT AGENT</span>
          <select id="portAgent">
            <option value="">select...</option>
            <option>Maersk Line Agency</option>
            <option>MSC Shipping Agency</option>
            <option>CMA CGM Agency</option>
            <option>Hapag-Lloyd Agency</option>
            <option>PIL Agency Ltd</option>
          </select>
        </div>
      </div>

      <!-- TABS NAV -->
      <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('file',this)">File No</button>
        <button class="tab-btn" onclick="switchTab('vessel',this)">Vessel</button>
        <button class="tab-btn" onclick="switchTab('duty',this)">Duty Payment</button>
      </div>

      <!-- ======================== TAB 1: FILE NO ======================== -->
      <div class="tab-content active" id="tab-file">
        <div class="scroll-indicator">
          <div class="arrows">
            <button title="Scroll Left">◀</button>
            <button title="Scroll Right">▶</button>
          </div>
          <button class="collapse-btn" title="Collapse">▲</button>
        </div>

        <div class="form-grid">
          <!-- Row 1: UIN | Customer | Customer Ref | Refer. Number -->
          <div class="form-row cols-4">
            <div class="form-cell">
              <label>UIN <span class="required-star">*</span></label>
              <select id="uin" required>
                <option value="">select...</option>
                <option>GFT</option>
                <option>KEN</option>
                <option>NBO</option>
                <option>JUA</option>
                <option>TZA</option>
              </select>
            </div>
            <div class="form-cell">
              <label>Customer <span class="required-star">*</span></label>
              <select id="customer" required>
                <option value="">select...</option>
                <option>GF Trucks and Equipment Ltd</option>
                <option>Trucks Direct Ltd</option>
                <option>Kenya Motors Ltd</option>
                <option>Africa Auto Distributors</option>
                <option>Nairobi Vehicle Imports</option>
                <option>Jumbo Autos Ltd</option>
              </select>
            </div>
            <div class="form-cell">
              <label>Customer Ref</label>
              <input type="text" id="customerRef" placeholder="">
            </div>
            <div class="form-cell">
              <label>Refer. Number</label>
              <input type="text" id="referNumber" placeholder="">
            </div>
          </div>

          <!-- Row 2: Invoice No | Supplier | B/L Number | POL/Country -->
          <div class="form-row cols-4">
            <div class="form-cell">
              <label>P/Invoice No</label>
              <input type="text" id="invoiceNo" placeholder="">
            </div>
            <div class="form-cell">
              <label>Supplier <span class="required-star">*</span></label>
              <select id="supplier" required>
                <option value="">select...</option>
                <option>FAW Trucks International Co., Ltd</option>
                <option>Sinotruk (HK) Int'l Co., Ltd</option>
                <option>Toyota Tsusho Africa</option>
                <option>Isuzu East Africa Ltd</option>
                <option>Mitsubishi Motors Corp.</option>
                <option>SANY Heavy Truck Co.</option>
                <option>Dongfeng Motor Corporation</option>
              </select>
            </div>
            <div class="form-cell">
              <label>B/L Number <span class="required-star">*</span></label>
              <input type="text" id="blNumber" placeholder="">
            </div>
            <div class="form-cell">
              <label>POL/Country</label>
              <select id="polCountry">
                <option value="">select...</option>
                <option>CNSHA – China/Shanghai</option>
                <option>CNNGB – China/Ningbo</option>
                <option>JPYOK – Japan/Yokohama</option>
                <option>AEDXB – UAE/Dubai</option>
                <option>SGSIN – Singapore</option>
                <option>INBOM – India/Mumbai</option>
              </select>
            </div>
          </div>

          <!-- Row 3: Material Desc | Units | S/Line | Consignee -->
          <div class="form-row cols-4">
            <div class="form-cell">
              <label>Material Desc.</label>
              <input type="text" id="materialDesc" placeholder="">
            </div>
            <div class="form-cell">
              <label>Units</label>
              <input type="number" id="units" min="1" placeholder="">
            </div>
            <div class="form-cell">
              <label>S/Line</label>
              <select id="sline">
                <option value="">select...</option>
                <option>MSC</option>
                <option>CMA CGM</option>
                <option>Maersk</option>
                <option>Evergreen</option>
                <option>Hapag-Lloyd</option>
                <option>PIL</option>
                <option>NYK</option>
              </select>
            </div>
            <div class="form-cell">
              <label>Consignee</label>
              <select id="consignee">
                <option value="">select...</option>
                <option>GF Trucks and Equipment Ltd</option>
                <option>Trucks Direct Ltd</option>
                <option>Kenya Motors Ltd</option>
                <option>Africa Auto Distributors</option>
                <option>Nairobi Vehicle Imports</option>
              </select>
            </div>
          </div>
        </div>

        <div class="bottom-scroll">
          <button>◀</button>
          <div class="scroll-bar-track"><div class="scroll-bar-thumb"></div></div>
          <button>▶</button>
        </div>
      </div>

      <!-- ======================== TAB 2: VESSEL ======================== -->
      <div class="tab-content" id="tab-vessel">
        <div class="scroll-indicator">
          <div class="arrows">
            <button title="Scroll Left">◀</button>
            <button title="Scroll Right">▶</button>
          </div>
          <button class="collapse-btn" title="Collapse">▲</button>
        </div>

        <div class="form-grid">
          <!-- Row 1: Vessel | Voyage | Copy Docs Recd Date | Org Doc Recd Date | ETD -->
          <div class="form-row cols-5">
            <div class="form-cell">
              <label>Vessel</label>
              <input type="text" id="vessel" placeholder="">
            </div>
            <div class="form-cell">
              <label>Voyage</label>
              <input type="text" id="voyage" placeholder="">
            </div>
            <div class="form-cell">
              <label>Copy Docs Recd Date</label>
              <input type="date" id="copyDocsRecd">
            </div>
            <div class="form-cell">
              <label>Org Doc Recd Date</label>
              <input type="date" id="orgDocsRecd">
            </div>
            <div class="form-cell">
              <label>ETD</label>
              <input type="date" id="etd">
            </div>
          </div>

          <!-- Row 2: ETA | ETB | S/L Inv Date | S/L Pay Date -->
          <div class="form-row cols-4">
            <div class="form-cell">
              <label>ETA</label>
              <input type="date" id="eta">
            </div>
            <div class="form-cell">
              <label>ETB</label>
              <input type="date" id="etb">
            </div>
            <div class="form-cell">
              <label>S/L Inv Date</label>
              <input type="date" id="slInvDate">
            </div>
            <div class="form-cell">
              <label>S/L Pay Date</label>
              <input type="date" id="slPayDate">
            </div>
          </div>

          <!-- Row 3: S/L DO Date | Direct/Bond | ICD | Manifest -->
          <div class="form-row cols-4">
            <div class="form-cell">
              <label>S/L DO Date</label>
              <input type="date" id="slDoDate">
            </div>
            <div class="form-cell">
              <label>Direct/Bond</label>
              <div class="radio-group">
                <input type="radio" id="direct" name="directBond" value="Direct">
                <label for="direct">Direct</label>
                <input type="radio" id="bond" name="directBond" value="Bond">
                <label for="bond">Bond</label>
              </div>
            </div>
            <div class="form-cell">
              <label>ICD</label>
              <select id="icd">
                <option value="">select...</option>
                <option>ICD Nairobi</option>
                <option>ICD Mombasa</option>
                <option>ICD Kisumu</option>
                <option>ICD Kampala</option>
              </select>
            </div>
            <div class="form-cell">
              <label>Manifest</label>
              <div class="checkbox-group">
                <input type="checkbox" id="manifest">
              </div>
            </div>
          </div>
        </div>

        <div class="bottom-scroll">
          <button>◀</button>
          <div class="scroll-bar-track"><div class="scroll-bar-thumb"></div></div>
          <button>▶</button>
        </div>
      </div>

      <!-- ======================== TAB 3: DUTY PAYMENT ======================== -->
      <div class="tab-content" id="tab-duty">
        <div class="scroll-indicator">
          <div class="arrows">
            <button title="Scroll Left">◀</button>
            <button title="Scroll Right">▶</button>
          </div>
          <button class="collapse-btn" title="Collapse">▲</button>
        </div>

        <div class="form-grid">
          <!-- Row 1: Doc Lodged Date | Assmt Valu. Date | Duty Pay Date | Transf. Manifest Date -->
          <div class="form-row cols-4">
            <div class="form-cell">
              <label>Doc. Lodged Date</label>
              <input type="date" id="docLodgedDate">
            </div>
            <div class="form-cell">
              <label>Assmt Valu. Date</label>
              <input type="date" id="assmtValuDate">
            </div>
            <div class="form-cell">
              <label>Duty Pay Date</label>
              <input type="date" id="dutyPayDate">
            </div>
            <div class="form-cell">
              <label>Transf. Manifest Date</label>
              <input type="date" id="transfManifestDate">
            </div>
          </div>

          <!-- Row 2: Verification Date | Wharfage Pay Date | RO Recd Date | Port Charge Pay Date -->
          <div class="form-row cols-4">
            <div class="form-cell">
              <label>Verification Date</label>
              <input type="date" id="verificationDate">
            </div>
            <div class="form-cell">
              <label>Wharfage Pay Date</label>
              <input type="date" id="wharfagePayDate">
            </div>
            <div class="form-cell">
              <label>RO Recd Date</label>
              <input type="date" id="roRecdDate">
            </div>
            <div class="form-cell">
              <label>Port Charge Pay Date</label>
              <input type="date" id="portChargePayDate">
            </div>
          </div>

          <!-- Row 3: ICD Charge Pay Date | Delivery Date | TBS | Remarks -->
          <div class="form-row cols-4">
            <div class="form-cell">
              <label>ICD Charge Pay Date</label>
              <input type="date" id="icdChargePayDate">
            </div>
            <div class="form-cell">
              <label>Delivery Date</label>
              <input type="date" id="deliveryDate">
            </div>
            <div class="form-cell">
              <label>TBS</label>
              <input type="text" id="tbs" placeholder="">
            </div>
            <div class="form-cell">
              <label>Remarks</label>
              <input type="text" id="remarks" placeholder="">
            </div>
          </div>
        </div>

        <div class="bottom-scroll">
          <button>◀</button>
          <div class="scroll-bar-track"><div class="scroll-bar-thumb"></div></div>
          <button>▶</button>
        </div>
      </div>

      <!-- FORM ACTIONS -->
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="resetForm()">Reset</button>
        <button class="btn btn-success" onclick="saveConsignment()">💾 Save Consignment</button>
      </div>
    </div><!-- end cargo-card -->
  </main>
</div>

<script>
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tabId).classList.add('active');
  btn.classList.add('active');
}

function validateForm() {
  let valid = true;
  const required = ['declarant','uin','customer','supplier','blNumber'];
  required.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (!el.value) {
      el.classList.add('field-error');
      valid = false;
    } else {
      el.classList.remove('field-error');
    }
  });
  return valid;
}

function saveConsignment() {
  if (!validateForm()) {
    alert('Please fill in all required fields (marked with *).\n\nRequired: Declarant, UIN, Customer, Supplier, B/L Number');
    // Switch to File tab to show errors
    switchTab('file', document.querySelector('.tab-btn'));
    return;
  }
  const data = {
    declarant: document.getElementById('declarant').value,
    portAgent: document.getElementById('portAgent').value,
    uin: document.getElementById('uin').value,
    customer: document.getElementById('customer').value,
    customerRef: document.getElementById('customerRef').value,
    referNumber: document.getElementById('referNumber').value,
    invoiceNo: document.getElementById('invoiceNo').value,
    supplier: document.getElementById('supplier').value,
    blNumber: document.getElementById('blNumber').value,
    polCountry: document.getElementById('polCountry').value,
    materialDesc: document.getElementById('materialDesc').value,
    units: document.getElementById('units').value,
    sline: document.getElementById('sline').value,
    consignee: document.getElementById('consignee').value,
    vessel: document.getElementById('vessel').value,
    voyage: document.getElementById('voyage').value,
    eta: document.getElementById('eta').value,
    etb: document.getElementById('etb').value,
  };
  alert('✅ Consignment saved successfully!\n\nFile No: VC/GFT/2026/' + String(Math.floor(Math.random()*900)+100) + '\nUIN: ' + data.uin + '\nCustomer: ' + data.customer + '\nSupplier: ' + data.supplier + '\nB/L Number: ' + data.blNumber);
  window.location.href = 'cargo-position.html';
}

function resetForm() {
  if (confirm('Reset all form fields?')) {
    document.querySelectorAll('input[type="text"], input[type="date"], input[type="number"]').forEach(el => el.value = '');
    document.querySelectorAll('select').forEach(el => el.value = '');
    document.querySelectorAll('input[type="radio"]').forEach(el => el.checked = false);
    document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
    document.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));
  }
}

// Clear error on input
document.querySelectorAll('select, input').forEach(el => {
  el.addEventListener('change', () => el.classList.remove('field-error'));
  el.addEventListener('input', () => el.classList.remove('field-error'));
});
</script>
</body>
</html>
