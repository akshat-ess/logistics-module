<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transit Remarks Master</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  body { background: #f4f4f4; font-size: 13px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  .page-title { font-size: 24px; font-weight: 400; color: #333; padding: 18px 20px 10px 20px; }
  .main-layout { display: flex; gap: 16px; padding: 0 20px 20px 20px; align-items: flex-start; }
  .form-card { width: 300px; min-width: 280px; background: #fff; border: 1px solid #ddd; border-radius: 3px; }
  .form-card-header { background: #f5f5f5; border-bottom: 1px solid #ddd; padding: 8px 14px; font-weight: 600; font-size: 13px; color: #333; }
  .form-card-body { padding: 14px; }
  .form-label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
  .form-control { font-size: 12px; border-radius: 2px; border: 1px solid #ccc; padding: 3px 8px; }
  .form-control:focus { border-color: #4a90d9; box-shadow: none; }
  .btn-add { background: #4a90d9; border: none; color: #fff; font-size: 12px; padding: 5px 16px; border-radius: 3px; cursor: pointer; }
  .btn-add:hover { background: #357abd; }
  .table-card { flex: 1; background: #fff; border: 1px solid #ddd; border-radius: 3px; }
  .table-card-header { background: #f5f5f5; border-bottom: 1px solid #ddd; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 8px; }
  .refresh-icon { color: #4a90d9; cursor: pointer; font-size: 14px; }
  .table-toolbar { padding: 8px 14px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; border-bottom: 1px solid #eee; }
  .search-label { font-size: 12px; color: #555; }
  .search-input { font-size: 12px; border: 1px solid #ccc; border-radius: 2px; height: 26px; padding: 2px 8px; width: 160px; }
  .search-input:focus { outline: none; border-color: #4a90d9; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table thead th { background: #f9f9f9; border-top: 1px solid #ddd; border-bottom: 2px solid #ccc; padding: 7px 12px; font-weight: 600; color: #555; cursor: pointer; }
  .data-table thead th:hover { background: #f0f0f0; }
  .data-table tbody tr { border-bottom: 1px solid #eee; }
  .data-table tbody tr:hover { background: #f5f9ff; }
  .data-table td { padding: 6px 12px; color: #333; vertical-align: middle; }
  .btn-edit { background: #4a90d9; border: none; color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 2px; cursor: pointer; }
  .btn-edit:hover { background: #357abd; }
  .btn-delete { background: #d9534f; border: none; color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 2px; cursor: pointer; }
  .btn-delete:hover { background: #c9302c; }
  .table-footer { padding: 8px 14px; font-size: 12px; color: #555; border-top: 1px solid #eee; }
  .table-scroll { max-height: 520px; overflow-y: auto; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9999; justify-content: center; align-items: center; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: #fff; border-radius: 4px; padding: 24px; width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  .modal-box h6 { margin-bottom: 14px; font-size: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .btn-cancel { background: #aaa; border: none; color: #fff; font-size: 12px; padding: 5px 14px; border-radius: 3px; cursor: pointer; }
  .btn-confirm-del { background: #d9534f; border: none; color: #fff; font-size: 12px; padding: 5px 14px; border-radius: 3px; cursor: pointer; }
  .no-data { text-align: center; color: #aaa; padding: 30px; font-size: 12px; }
  .sort-asc::after { content: ' ▲'; font-size: 10px; }
  .sort-desc::after { content: ' ▼'; font-size: 10px; }
</style>
</head>
<body>

<div class="page-title">Remarks</div>

<div class="main-layout">
  <!-- LEFT: Form Card -->
  <div class="form-card">
    <div class="form-card-header">Add Remarks</div>
    <div class="form-card-body">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <textarea id="recName" class="form-control" rows="3" placeholder="" style="height:auto;"></textarea>
      </div>
      <button class="btn-add" id="submitBtn" onclick="addRecord()">Add Remarks</button>
    </div>
  </div>

  <!-- RIGHT: Table Card -->
  <div class="table-card">
    <div class="table-card-header">
      All Remarks <i class="fas fa-sync-alt refresh-icon" onclick="renderTable()"></i>
    </div>
    <div class="table-toolbar">
      <span class="search-label">Search:</span>
      <input type="text" class="search-input" id="searchInput" oninput="searchTable()" placeholder="">
      <i class="fas fa-sort" style="color:#aaa; font-size:11px;"></i>
    </div>
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th onclick="sortTable(0)">Name</th>
            <th style="width:100px;" onclick="sortTable(1)">Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="table-footer" id="tableFooter">Showing 0 entries</div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <h6>Confirm Delete</h6>
    <p style="font-size:13px;">Are you sure you want to delete this record?</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm-del" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'transit_remarks_data';
  let records = [];
  let editId = null;
  let deleteId = null;
  let sortColIndex = -1;
  let sortDir = 'asc';

  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      records = JSON.parse(saved);
    } else {
      const preload = [
        '30 KM TO RUSIZI DESTINATION',
        'ACCIDENT',
        'ACCIDENT AT BWAWA LA SAMAKI',
        'ACCIDENT AT CHAMBISHI',
        'ACCIDENT AT CHIBOMBO',
        'ACCIDENT AT CHIMALA',
        'ACCIDENT AT CHINSALI',
        'ACCIDENT AT DANGER HILL',
        'ACCIDENT AT DODOMA',
        'ACCIDENT AT GITEGA',
        'ACCIDENT AT ILULA',
      ];
      records = preload.map(n => ({ id: genId(), name: n }));
      saveData();
    }
  }

  function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
  function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

  function addRecord() {
    const nameVal = document.getElementById('recName').value.trim();
    if (!nameVal) { alert('Name is required.'); return; }
    if (editId) {
      const rec = records.find(r => r.id === editId);
      if (rec) rec.name = nameVal;
      editId = null;
      document.getElementById('submitBtn').textContent = 'Add Remarks';
    } else {
      records.push({ id: genId(), name: nameVal });
    }
    saveData();
    document.getElementById('recName').value = '';
    renderTable();
  }

  function editRecord(id) {
    const rec = records.find(r => r.id === id);
    if (!rec) return;
    editId = id;
    document.getElementById('recName').value = rec.name;
    document.getElementById('submitBtn').textContent = 'Update Remarks';
  }

  function deleteRecord(id) {
    deleteId = id;
    document.getElementById('deleteModal').classList.add('active');
  }

  function closeModal() {
    deleteId = null;
    document.getElementById('deleteModal').classList.remove('active');
  }

  function confirmDelete() {
    records = records.filter(r => r.id !== deleteId);
    saveData();
    closeModal();
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const search = document.getElementById('searchInput').value.toLowerCase();
    let filtered = records.filter(r => r.name.toLowerCase().includes(search));

    if (sortColIndex === 0) {
      filtered.sort((a, b) => sortDir === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
    }

    tbody.innerHTML = '';
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="2" class="no-data">No data available</td></tr>`;
      document.getElementById('tableFooter').textContent = 'Showing 0 entries';
      return;
    }

    filtered.forEach(rec => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escHtml(rec.name)}</td>
        <td>
          <button class="btn-edit" onclick="editRecord('${rec.id}')">Edit</button>
        </td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('tableFooter').textContent = `Showing 1 to ${filtered.length} of ${records.length} entries`;
  }

  function searchTable() { renderTable(); }

  function sortTable(colIdx) {
    if (sortColIndex === colIdx) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
    else { sortColIndex = colIdx; sortDir = 'asc'; }
    renderTable();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadData();
  renderTable();
</script>
</body>
</html>
