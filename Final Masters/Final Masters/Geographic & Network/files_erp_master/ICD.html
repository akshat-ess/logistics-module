<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ICD Master</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px; color: #333; }
  .page-header { background: #fff; border-bottom: 1px solid #dde1e7; padding: 10px 20px; margin-bottom: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .page-header h4 { margin: 0; font-size: 18px; font-weight: 600; color: #1a2b4a; }
  .card { border: 1px solid #dde1e7; border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,.07); background: #fff; }
  .card-header { background: #f7f8fa; border-bottom: 1px solid #dde1e7; padding: 8px 14px; font-weight: 600; font-size: 13px; color: #1a2b4a; border-radius: 6px 6px 0 0 !important; }
  .form-label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 3px; }
  .form-control { font-size: 12px; padding: 5px 9px; border-radius: 4px; border: 1px solid #cdd0d5; }
  .form-control:focus { border-color: #3b7ddd; box-shadow: 0 0 0 2px rgba(59,125,221,.15); }
  .btn-sm { font-size: 11px; padding: 3px 9px; border-radius: 3px; }
  .btn-primary { background: #3b7ddd; border-color: #3b7ddd; font-size: 12px; }
  .btn-primary:hover { background: #2f6cbf; border-color: #2f6cbf; }
  .btn-info { background: #17a2b8; border-color: #17a2b8; color: #fff; }
  .btn-info:hover { background: #138496; border-color: #138496; color: #fff; }
  .btn-danger { background: #dc3545; border-color: #dc3545; }
  .table { font-size: 12px; margin-bottom: 0; }
  .table thead th { background: #f0f2f5; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: #555; border-bottom: 2px solid #dde1e7; padding: 8px 10px; cursor: pointer; white-space: nowrap; user-select: none; }
  .table thead th:hover { background: #e4e7ec; }
  .sort-icon { margin-left: 4px; color: #aaa; font-size: 10px; }
  .table tbody td { padding: 6px 10px; vertical-align: middle; border-color: #eef0f3; }
  .table-hover tbody tr:hover { background: #f4f8ff; }
  .table-striped tbody tr:nth-child(odd) { background-color: #fafbfc; }
  .search-box { max-width: 200px; }
  .pagination .page-link { font-size: 11px; padding: 4px 9px; color: #3b7ddd; border-color: #dde1e7; }
  .pagination .page-item.active .page-link { background: #3b7ddd; border-color: #3b7ddd; }
  .table-container { overflow-x: auto; max-height: 400px; overflow-y: auto; }
  .table-container thead th { position: sticky; top: 0; z-index: 1; }
  .records-info { font-size: 11px; color: #777; }
  .container-fluid { padding: 0 18px; }
  .modal-header { background: #1a2b4a; color: #fff; padding: 10px 16px; }
  .modal-header .btn-close { filter: invert(1); }
  .modal-title { font-size: 14px; font-weight: 600; }
  .zero-badge { display:inline-block; background:#e9ecef; color:#555; font-size:10px; padding:1px 6px; border-radius:3px; }
</style>
</head>
<body>
<div class="page-header">
  <h4><i class="bi bi-building me-2 text-primary"></i>ICD</h4>
</div>
<div class="container-fluid">
  <div class="row g-3">
    <div class="col-md-3">
      <div class="card">
        <div class="card-header">Add ICD</div>
        <div class="card-body p-3">
          <form id="icdForm" novalidate>
            <div class="mb-2">
              <label class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="icdName" placeholder="Enter ICD name" required/>
              <div class="invalid-feedback">Name is required.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" id="icdAddress" placeholder="Enter address"/>
            </div>
            <div class="mb-2">
              <label class="form-label">Code</label>
              <input type="text" class="form-control" id="icdCode" placeholder="Enter code"/>
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="icdEmail" placeholder="Enter email"/>
            </div>
            <div class="mb-3">
              <label class="form-label">Telephone</label>
              <input type="text" class="form-control" id="icdTel" placeholder="Enter telephone"/>
            </div>
            <button type="submit" class="btn btn-primary btn-sm px-3">
              <i class="bi bi-plus-circle me-1"></i>Add ICD
            </button>
            <button type="button" class="btn btn-secondary btn-sm px-3 ms-1" onclick="resetForm()">
              <i class="bi bi-x-circle me-1"></i>Clear
            </button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-md-9">
      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <span>All ICDs <button class="btn btn-link btn-sm p-0 ms-1" onclick="filterTable()" title="Refresh"><i class="bi bi-arrow-clockwise text-primary"></i></button></span>
          <div class="d-flex align-items-center gap-2">
            <span class="text-muted me-1" style="font-size:11px">Search:</span>
            <input type="text" class="form-control form-control-sm search-box" id="searchInput" oninput="filterTable()"/>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-container">
            <table class="table table-striped table-bordered table-hover mb-0">
              <thead>
                <tr>
                  <th onclick="sortTable(0)">Name <span class="sort-icon" id="sort-0"><i class="bi bi-arrow-down-up"></i></span></th>
                  <th onclick="sortTable(1)">Address <span class="sort-icon" id="sort-1"><i class="bi bi-arrow-down-up"></i></span></th>
                  <th onclick="sortTable(2)">Code <span class="sort-icon" id="sort-2"><i class="bi bi-arrow-down-up"></i></span></th>
                  <th onclick="sortTable(3)">Email <span class="sort-icon" id="sort-3"><i class="bi bi-arrow-down-up"></i></span></th>
                  <th onclick="sortTable(4)">Telephone <span class="sort-icon" id="sort-4"><i class="bi bi-arrow-down-up"></i></span></th>
                  <th style="width:140px">Action</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="d-flex align-items-center justify-content-between px-3 py-2 border-top">
            <span class="records-info" id="recordsInfo"></span>
            <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Edit ICD</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-3">
        <input type="hidden" id="editIndex"/>
        <div class="row g-2">
          <div class="col-md-6"><label class="form-label">Name <span class="text-danger">*</span></label><input type="text" class="form-control" id="editName"/></div>
          <div class="col-md-6"><label class="form-label">Address</label><input type="text" class="form-control" id="editAddress"/></div>
          <div class="col-md-4"><label class="form-label">Code</label><input type="text" class="form-control" id="editCode"/></div>
          <div class="col-md-4"><label class="form-label">Email</label><input type="email" class="form-control" id="editEmail"/></div>
          <div class="col-md-4"><label class="form-label">Telephone</label><input type="text" class="form-control" id="editTel"/></div>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Confirm Delete</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-3"><p class="mb-0" style="font-size:13px">Delete <strong id="deleteNameDisplay"></strong>?</p></div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data=[
  {name:'AF FAST LOGISTICS COMPANY',address:'',code:'',email:'',tel:'0'},
  {name:'AFICD',address:'',code:'',email:'',tel:'0'},
  {name:'AIR',address:'',code:'',email:'',tel:'0'},
  {name:'AL-HUSHOOM',address:'',code:'',email:'',tel:'0'},
  {name:'AMI',address:'',code:'',email:'',tel:'0'},
  {name:'AZAM',address:'',code:'',email:'',tel:'0'},
  {name:'BLOOMER TANZANIA',address:'',code:'',email:'',tel:'0'},
  {name:'BY ROAD',address:'',code:'',email:'',tel:'0'},
  {name:'DEUMEUM LIMITED',address:'',code:'',email:'',tel:'0'},
  {name:'DEUMEUM LIMITED [WITZDL047]',address:'',code:'WITZDL047',email:'',tel:'0'},
  {name:'DICD',address:'',code:'',email:'',tel:'0'},
  {name:'DP WORLD',address:'DAR ES SALAAM',code:'',email:'',tel:'0'},
  {name:'EAST COAST',address:'',code:'',email:'',tel:'0'},
  {name:'ETC',address:'',code:'',email:'',tel:'0'}
];
let filtered=[...data],sortCol=0,sortDir=1,currentPage=1,pageSize=10,deleteIdx=-1;
const editModal=new bootstrap.Modal(document.getElementById('editModal'));
const deleteModal=new bootstrap.Modal(document.getElementById('deleteModal'));

function filterTable(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  filtered=data.filter(r=>Object.values(r).some(v=>v.toLowerCase().includes(q)));
  currentPage=1;renderTable();
}
function sortTable(col){
  if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}
  document.querySelectorAll('.sort-icon').forEach((el,i)=>{
    el.innerHTML=i===col?(sortDir===1?'<i class="bi bi-arrow-up"></i>':'<i class="bi bi-arrow-down"></i>'):'<i class="bi bi-arrow-down-up"></i>';
  });
  const keys=['name','address','code','email','tel'];
  filtered.sort((a,b)=>a[keys[col]].localeCompare(b[keys[col]])*sortDir);
  renderTable();
}
function renderTable(){
  const tbody=document.getElementById('tableBody');
  const start=(currentPage-1)*pageSize;
  const pageData=filtered.slice(start,start+pageSize);
  tbody.innerHTML=pageData.map((r,i)=>`
    <tr>
      <td>${r.name}</td><td>${r.address}</td><td>${r.code}</td><td>${r.email}</td>
      <td><span class="zero-badge">${r.tel||'0'}</span></td>
      <td>
        <button class="btn btn-info btn-sm me-1" onclick="openEdit(${start+i})"><i class="bi bi-pencil-fill me-1"></i>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="openDelete(${start+i})"><i class="bi bi-trash-fill me-1"></i>Delete</button>
      </td>
    </tr>`).join('');
  renderPagination();
  const s=start+1,e=Math.min(start+pageSize,filtered.length);
  document.getElementById('recordsInfo').textContent=filtered.length>0?`Showing ${s} to ${e} of ${filtered.length} entries`:'No entries found';
}
function renderPagination(){
  const total=Math.ceil(filtered.length/pageSize);
  const ul=document.getElementById('pagination');
  let html=`<li class="page-item ${currentPage===1?'disabled':''}"><a class="page-link" href="#" onclick="goPage(${currentPage-1});return false;">‹</a></li>`;
  for(let i=1;i<=total;i++){
    if(total>7&&Math.abs(i-currentPage)>2&&i!==1&&i!==total){if(i===2||i===total-1)html+=`<li class="page-item disabled"><a class="page-link">…</a></li>`;continue;}
    html+=`<li class="page-item ${i===currentPage?'active':''}"><a class="page-link" href="#" onclick="goPage(${i});return false;">${i}</a></li>`;
  }
  html+=`<li class="page-item ${currentPage===total||total===0?'disabled':''}"><a class="page-link" href="#" onclick="goPage(${currentPage+1});return false;">›</a></li>`;
  ul.innerHTML=html;
}
function goPage(p){const t=Math.ceil(filtered.length/pageSize);if(p<1||p>t)return;currentPage=p;renderTable();}
document.getElementById('icdForm').addEventListener('submit',function(e){
  e.preventDefault();
  const n=document.getElementById('icdName');
  if(!n.value.trim()){n.classList.add('is-invalid');return;}
  n.classList.remove('is-invalid');
  data.push({name:n.value.trim(),address:document.getElementById('icdAddress').value.trim(),code:document.getElementById('icdCode').value.trim(),email:document.getElementById('icdEmail').value.trim(),tel:document.getElementById('icdTel').value.trim()||'0'});
  filterTable();resetForm();
});
document.getElementById('icdName').addEventListener('input',function(){this.classList.remove('is-invalid');});
function resetForm(){document.getElementById('icdForm').reset();}
function openEdit(idx){
  const r=filtered[idx];
  document.getElementById('editIndex').value=idx;
  document.getElementById('editName').value=r.name;
  document.getElementById('editAddress').value=r.address;
  document.getElementById('editCode').value=r.code;
  document.getElementById('editEmail').value=r.email;
  document.getElementById('editTel').value=r.tel;
  editModal.show();
}
function saveEdit(){
  const idx=parseInt(document.getElementById('editIndex').value);
  const n=document.getElementById('editName').value.trim();if(!n)return;
  const orig=filtered[idx],di=data.indexOf(orig);
  data[di]={name:n,address:document.getElementById('editAddress').value.trim(),code:document.getElementById('editCode').value.trim(),email:document.getElementById('editEmail').value.trim(),tel:document.getElementById('editTel').value.trim()||'0'};
  filterTable();editModal.hide();
}
function openDelete(idx){deleteIdx=idx;document.getElementById('deleteNameDisplay').textContent=filtered[idx].name;deleteModal.show();}
function confirmDelete(){const orig=filtered[deleteIdx],di=data.indexOf(orig);data.splice(di,1);filterTable();deleteModal.hide();}
filterTable();
</script>
</body>
</html>
