<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Suppliers Master - ERP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  body{background:#f0f2f5;font-family:'Segoe UI',sans-serif;font-size:13px;}
  .erp-header{background:#1a3c6e;color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;}
  .erp-header .brand{font-size:18px;font-weight:700;}
  .page-title{font-size:24px;font-weight:600;padding:15px 20px 5px;color:#222;}
  .left-card{background:#fff;border:1px solid #dde;border-radius:4px;padding:15px;}
  .left-card-title{font-weight:600;font-size:13px;margin-bottom:12px;color:#333;border-bottom:1px solid #eee;padding-bottom:6px;}
  .right-card{background:#fff;border:1px solid #dde;border-radius:4px;}
  .right-card-header{background:#f5f6f8;border-bottom:1px solid #dde;padding:8px 14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;}
  .form-label{font-size:12px;font-weight:500;margin-bottom:3px;color:#444;}
  .form-control{font-size:12px;height:30px;border-radius:3px;border:1px solid #ccc;}
  .btn-add{background:#337ab7;color:#fff;font-size:12px;border-radius:3px;padding:5px 14px;border:none;margin-top:6px;}
  .btn-edit{background:#337ab7;color:#fff;font-size:11px;padding:2px 8px;border-radius:3px;border:none;display:block;margin-bottom:2px;}
  .btn-delete{background:#d9534f;color:#fff;font-size:11px;padding:2px 8px;border-radius:3px;border:none;display:block;}
  .btn-plus-email{background:#5bc0de;color:#fff;border:none;border-radius:3px;padding:2px 7px;font-size:12px;cursor:pointer;}
  table.dataTable thead th{background:#f5f6f8;font-size:12px;font-weight:600;border-bottom:2px solid #dde;white-space:nowrap;}
  table.dataTable tbody td{font-size:12px;vertical-align:middle;}
  .btn-refresh{background:none;border:none;color:#337ab7;font-size:14px;cursor:pointer;}
  .email-list{font-size:11px;color:#337ab7;}
  .email-list div{line-height:1.4;}
  .action-cell{white-space:nowrap;}
</style>
</head>
<body>
<!-- <div class="erp-header">
  <div class="brand"><i class="fa fa-cube me-2"></i>HONEST LOGISTICS LTD</div>
  <div><a href="#" style="color:#cde;text-decoration:none;font-size:12px;">Master ▾</a></div>
  <div style="font-size:12px;color:#acd;"><i class="fa fa-user-circle me-1"></i>temp user</div>
</div> -->

<div class="page-title">Suppliers</div>

<div class="px-3 pb-3 d-flex gap-3 align-items-start">
  <div style="width:300px;flex-shrink:0;">
    <div class="left-card">
      <div class="left-card-title">Add Suppliers</div>
      <div class="mb-2"><label class="form-label">Name</label><input type="text" id="f_name" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">VRN</label><input type="text" id="f_vrn" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">TIN</label><input type="text" id="f_tin" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Telephone</label><input type="text" id="f_telephone" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Address</label><input type="text" id="f_address" class="form-control"/></div>
      <button class="btn-add" onclick="saveRecord()">Add Suppliers</button>
    </div>
  </div>
  <div class="flex-grow-1">
    <div class="right-card">
      <div class="right-card-header">All Suppliers <button class="btn-refresh" onclick="buildTable()"><i class="fa fa-sync-alt"></i></button></div>
      <div class="p-2">
        <table id="mainTable" class="table table-bordered table-hover table-sm w-100">
          <thead><tr><th>Name</th><th>VRN</th><th>TIN</th><th>Telephone</th><th>Email</th><th>Address</th><th>Action</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header py-2"><h6 class="modal-title">Edit Supplier</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="editIndex"/>
      <div class="mb-2"><label class="form-label">Name</label><input id="e_name" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">VRN</label><input id="e_vrn" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">TIN</label><input id="e_tin" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Telephone</label><input id="e_telephone" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Address</label><input id="e_address" class="form-control"/></div>
    </div>
    <div class="modal-footer py-1">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="updateRecord()">Save</button>
    </div>
  </div></div>
</div>

<div class="modal fade" id="emailModal" tabindex="-1">
  <div class="modal-dialog modal-sm"><div class="modal-content">
    <div class="modal-header py-2"><h6 class="modal-title">Add Email</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="emailRowIndex"/>
      <label class="form-label">Email Address</label>
      <input type="email" id="emailInput" class="form-control"/>
    </div>
    <div class="modal-footer py-1">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="addEmail()">Add</button>
    </div>
  </div></div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm"><div class="modal-content">
    <div class="modal-header py-2"><h6 class="modal-title">Confirm Delete</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><p class="mb-0">Delete this supplier?</p></div>
    <div class="modal-footer py-1">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-danger btn-sm" onclick="confirmDelete()">Delete</button>
    </div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/js/dataTables.bootstrap5.min.js"></script>
<script>
const SK='erp_suppliers';let delIdx=-1;
const def=[
  {name:'1 MARCHE LLP',vrn:'0',tin:'0',telephone:'',emails:[],address:''},
  {name:'15MCC INTERNATIONAL ENGINEERING CO LTD',vrn:'0',tin:'0',telephone:'',emails:[],address:''},
  {name:'20 MICRONS LIMITED',vrn:'0',tin:'0',telephone:'',emails:[],address:''},
  {name:'3-ANGLE TRADING B.V.',vrn:'0',tin:'0',telephone:'',emails:[],address:''},
  {name:'3W NETWORKS',vrn:'0',tin:'0',telephone:'',emails:[],address:''},
  {name:'4 PACKAGING AFRICA (PTY) LTD',vrn:'0',tin:'0',telephone:'',emails:[],address:''},
  {name:'5A MOBILYA SAN TIC. LTD. STI.',vrn:'0',tin:'0',telephone:'',emails:[],address:''},
  {name:'5s ELECTRONICS FZE',vrn:'0',tin:'0',telephone:'',emails:[],address:''},
  {name:'63150 HEIJSENSTAMM',vrn:'0',tin:'0',telephone:'',emails:[],address:'GERMANY'},
];

function getData(){const s=localStorage.getItem(SK);return s?JSON.parse(s):[...def];}
function saveData(d){localStorage.setItem(SK,JSON.stringify(d));}

let dt;
function buildTable(){
  const data=getData();if(dt){dt.destroy();}
  const tbody=$('#mainTable tbody');tbody.empty();
  data.forEach((r,i)=>{
    const emailHtml=r.emails.length>0?`<div class="email-list">${r.emails.map(e=>`<div>${e}</div>`).join('')}</div>`:'';
    tbody.append(`<tr>
      <td>${r.name}</td><td>${r.vrn}</td><td>${r.tin}</td><td>${r.telephone}</td>
      <td>${emailHtml}<button class="btn-plus-email" onclick="openEmail(${i})"><i class="fa fa-plus"></i></button></td>
      <td>${r.address}</td>
      <td class="action-cell">
        <button class="btn-edit" onclick="editRec(${i})">Edit</button>
        <button class="btn-delete" onclick="openDel(${i})">Delete</button>
      </td>
    </tr>`);
  });
  dt=$('#mainTable').DataTable({pageLength:10,order:[[0,'asc']],columnDefs:[{orderable:false,targets:[4,6]}]});
}

function saveRecord(){
  const name=$('#f_name').val().trim();if(!name){alert('Name required');return;}
  const data=getData();
  data.push({name,vrn:$('#f_vrn').val()||'0',tin:$('#f_tin').val()||'0',telephone:$('#f_telephone').val().trim(),emails:[],address:$('#f_address').val().trim()});
  saveData(data);$('#f_name,#f_vrn,#f_tin,#f_telephone,#f_address').val('');buildTable();
}
function editRec(i){
  const data=getData();const r=data[i];
  $('#editIndex').val(i);$('#e_name').val(r.name);$('#e_vrn').val(r.vrn);
  $('#e_tin').val(r.tin);$('#e_telephone').val(r.telephone);$('#e_address').val(r.address);
  new bootstrap.Modal(document.getElementById('editModal')).show();
}
function updateRecord(){
  const data=getData();const i=parseInt($('#editIndex').val());
  data[i]={...data[i],name:$('#e_name').val().trim(),vrn:$('#e_vrn').val(),tin:$('#e_tin').val(),telephone:$('#e_telephone').val(),address:$('#e_address').val()};
  saveData(data);bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();buildTable();
}
function openEmail(i){$('#emailRowIndex').val(i);$('#emailInput').val('');new bootstrap.Modal(document.getElementById('emailModal')).show();}
function addEmail(){
  const email=$('#emailInput').val().trim();if(!email){alert('Enter email');return;}
  const data=getData();data[parseInt($('#emailRowIndex').val())].emails.push(email);saveData(data);
  bootstrap.Modal.getInstance(document.getElementById('emailModal')).hide();buildTable();
}
function openDel(i){delIdx=i;new bootstrap.Modal(document.getElementById('deleteModal')).show();}
function confirmDelete(){
  const data=getData();data.splice(delIdx,1);saveData(data);
  bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();buildTable();
}
$(()=>buildTable());
</script>
</body>
</html>
