<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Source Of Business - ERP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  body{background:#f0f2f5;font-family:'Segoe UI',sans-serif;font-size:13px;}
  .erp-header{background:#1a3c6e;color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;}
  .erp-header .brand{font-size:18px;font-weight:700;}
  .page-title{font-size:24px;font-weight:600;padding:15px 20px 5px;color:#222;}
  .left-card{background:#fff;border:1px solid #dde;border-radius:4px;padding:15px;}
  .left-card-title{font-weight:600;font-size:13px;margin-bottom:12px;color:#333;border-bottom:1px solid #eee;padding-bottom:6px;}
  .right-card{background:#fff;border:1px solid #dde;border-radius:4px;}
  .right-card-header{background:#f5f6f8;border-bottom:1px solid #dde;padding:8px 14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;}
  .form-label{font-size:12px;font-weight:500;margin-bottom:3px;color:#444;}
  .form-control,.form-select{font-size:12px;border-radius:3px;border:1px solid #ccc;}
  input.form-control{height:30px;}
  select[multiple]{height:100px;}
  .btn-add{background:#337ab7;color:#fff;font-size:12px;border-radius:3px;padding:5px 14px;border:none;margin-top:6px;}
  .btn-edit{background:#337ab7;color:#fff;font-size:11px;padding:2px 8px;border-radius:3px;border:none;}
  .btn-delete{background:#d9534f;color:#fff;font-size:11px;padding:2px 8px;border-radius:3px;border:none;}
  .badge-active{background:#5cb85c;color:#fff;padding:2px 7px;border-radius:3px;font-size:11px;}
  .badge-inactive{background:#d9534f;color:#fff;padding:2px 7px;border-radius:3px;font-size:11px;}
  table.dataTable thead th{background:#f5f6f8;font-size:12px;font-weight:600;border-bottom:2px solid #dde;white-space:nowrap;}
  table.dataTable tbody td{font-size:12px;vertical-align:middle;}
  .btn-refresh{background:none;border:none;color:#337ab7;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
<!-- <div class="erp-header">
  <div class="brand"><i class="fa fa-cube me-2"></i>HONEST LOGISTICS LTD</div>
  <div><a href="#" style="color:#cde;text-decoration:none;font-size:12px;">Master ▾</a></div>
  <div style="font-size:12px;color:#acd;"><i class="fa fa-user-circle me-1"></i>temp user</div>
</div> -->

<div class="page-title">Source Of Business</div>

<div class="px-3 pb-3 d-flex gap-3 align-items-start">
  <div style="width:300px;flex-shrink:0;">
    <div class="left-card">
      <div class="left-card-title">Add Source Of Business</div>
      <div class="mb-2"><label class="form-label">Name</label><input type="text" id="f_name" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Address</label><input type="text" id="f_address" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Code</label><input type="text" id="f_code" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Telephone</label><input type="text" id="f_telephone" class="form-control"/></div>
      <div class="mb-2">
        <label class="form-label">Division</label>
        <select id="f_division" multiple class="form-control">
          <option>NAS</option><option>LOCAL CLEARANCE</option><option>TRANSIT</option>
          <option>VEHICLE CLEARANCE</option><option>RETURN</option><option>EXPORTS</option>
        </select>
      </div>
      <div class="mb-2">
        <label class="form-label">Status</label>
        <select id="f_status" class="form-select"><option value="">select...</option><option>Active</option><option>Inactive</option></select>
      </div>
      <button class="btn-add" onclick="saveRecord()">Add Source</button>
    </div>
  </div>
  <div class="flex-grow-1">
    <div class="right-card">
      <div class="right-card-header">All Sources <button class="btn-refresh" onclick="buildTable()"><i class="fa fa-sync-alt"></i></button></div>
      <div class="p-2">
        <table id="mainTable" class="table table-bordered table-hover table-sm w-100">
          <thead><tr><th>Name</th><th>Address</th><th>Code</th><th>Telephone</th><th>Division</th><th>Status</th><th>Action</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header py-2"><h6 class="modal-title">Edit Source</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="editIndex"/>
      <div class="mb-2"><label class="form-label">Name</label><input id="e_name" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Address</label><input id="e_address" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Code</label><input id="e_code" class="form-control"/></div>
      <div class="mb-2"><label class="form-label">Telephone</label><input id="e_telephone" class="form-control"/></div>
      <div class="mb-2">
        <label class="form-label">Division</label>
        <select id="e_division" multiple class="form-control">
          <option>NAS</option><option>LOCAL CLEARANCE</option><option>TRANSIT</option>
          <option>VEHICLE CLEARANCE</option><option>RETURN</option><option>EXPORTS</option>
        </select>
      </div>
      <div class="mb-2">
        <label class="form-label">Status</label>
        <select id="e_status" class="form-select"><option>Active</option><option>Inactive</option></select>
      </div>
    </div>
    <div class="modal-footer py-1">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="updateRecord()">Save</button>
    </div>
  </div></div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm"><div class="modal-content">
    <div class="modal-header py-2"><h6 class="modal-title">Confirm Delete</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><p class="mb-0">Delete this record?</p></div>
    <div class="modal-footer py-1">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-danger btn-sm" onclick="confirmDelete()">Delete</button>
    </div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/js/dataTables.bootstrap5.min.js"></script>
<script>
const SK='erp_sources';let delIdx=-1;
const def=[
  {name:'HONEST BURUNDI',address:'',code:'HBU',telephone:'0',division:['TRANSIT'],status:'Active'},
  {name:'HONEST DRC',address:'',code:'HDRC',telephone:'0',division:['TRANSIT'],status:'Active'},
  {name:'HONEST HEADOFFICE',address:'',code:'HLL',telephone:'0',division:['TRANSIT','RETURN'],status:'Active'},
  {name:'HONEST INDIA',address:'',code:'HIN',telephone:'0',division:['TRANSIT'],status:'Active'},
  {name:'HONEST MALAWI',address:'',code:'HMW',telephone:'0',division:['TRANSIT','RETURN'],status:'Active'},
  {name:'HONEST NETWORK',address:'',code:'NET',telephone:'0',division:['TRANSIT','RETURN'],status:'Active'},
  {name:'HONEST RWANDA',address:'',code:'HRW',telephone:'0',division:['TRANSIT'],status:'Active'},
  {name:'HONEST ZAMBIA',address:'',code:'HZM',telephone:'0',division:['TRANSIT'],status:'Active'},
  {name:'TBL',address:'',code:'TBL',telephone:'0',division:['TRANSIT'],status:'Active'},
  {name:'TLS',address:'',code:'TLS',telephone:'0',division:['TRANSIT'],status:'Active'},
];

function getData(){const s=localStorage.getItem(SK);return s?JSON.parse(s):[...def];}
function saveData(d){localStorage.setItem(SK,JSON.stringify(d));}

let dt;
function buildTable(){
  const data=getData();if(dt){dt.destroy();}
  const tbody=$('#mainTable tbody');tbody.empty();
  data.forEach((r,i)=>{
    const badge=r.status==='Active'?'<span class="badge-active">Active</span>':'<span class="badge-inactive">Inactive</span>';
    tbody.append(`<tr>
      <td>${r.name}</td><td>${r.address}</td><td>${r.code}</td><td>${r.telephone}</td>
      <td>${JSON.stringify(r.division)}</td><td>${badge}</td>
      <td><button class="btn-edit me-1" onclick="editRec(${i})">Edit</button><button class="btn-delete" onclick="openDel(${i})">Delete</button></td>
    </tr>`);
  });
  dt=$('#mainTable').DataTable({pageLength:10,order:[[0,'asc']],columnDefs:[{orderable:false,targets:6}]});
}

function saveRecord(){
  const name=$('#f_name').val().trim();if(!name){alert('Name required');return;}
  const division=Array.from(document.getElementById('f_division').selectedOptions).map(o=>o.value);
  const data=getData();
  data.push({name,address:$('#f_address').val().trim(),code:$('#f_code').val().trim(),telephone:$('#f_telephone').val().trim()||'0',division,status:$('#f_status').val()||'Active'});
  saveData(data);$('#f_name,#f_address,#f_code,#f_telephone').val('');buildTable();
}

function editRec(i){
  const data=getData();const r=data[i];
  $('#editIndex').val(i);$('#e_name').val(r.name);$('#e_address').val(r.address);
  $('#e_code').val(r.code);$('#e_telephone').val(r.telephone);$('#e_status').val(r.status);
  Array.from(document.getElementById('e_division').options).forEach(o=>o.selected=r.division.includes(o.value));
  new bootstrap.Modal(document.getElementById('editModal')).show();
}
function updateRecord(){
  const data=getData();const i=parseInt($('#editIndex').val());
  const division=Array.from(document.getElementById('e_division').selectedOptions).map(o=>o.value);
  data[i]={...data[i],name:$('#e_name').val().trim(),address:$('#e_address').val().trim(),code:$('#e_code').val().trim(),telephone:$('#e_telephone').val().trim(),division,status:$('#e_status').val()};
  saveData(data);bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();buildTable();
}
function openDel(i){delIdx=i;new bootstrap.Modal(document.getElementById('deleteModal')).show();}
function confirmDelete(){
  const data=getData();data.splice(delIdx,1);saveData(data);
  bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();buildTable();
}
$(()=>buildTable());
</script>
</body>
</html>
