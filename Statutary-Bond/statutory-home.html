<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Statutory Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root {
      --bg: #f0f2f5;
      --border: #dee2e6;
      --card-green-bg: #e8f5e3;
      --card-green-border: #b8d9a8;
      --icon-green: #3d8b37;
      --text-dark: #2c3e50;
    }
    body {
      background: var(--bg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      color: #333;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 30px 24px;
      min-height: 100vh;
    }

    /* ── Statutory Card ─────────────────────────────── */
    .statutory-card {
      background: var(--card-green-bg);
      border: 1px solid var(--card-green-border);
      border-radius: 8px;
      padding: 16px 20px 18px 16px;
      width: 340px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* Header row: icon + title */
    .card-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    /* Stacked icon: person + shield */
    .icon-stack {
      position: relative;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }
    .icon-stack .fa-user {
      font-size: 36px;
      color: var(--icon-green);
      position: absolute;
      top: 0;
      left: 0;
    }
    .icon-stack .fa-shield-halved {
      font-size: 18px;
      color: var(--icon-green);
      position: absolute;
      bottom: 0;
      right: 0;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--icon-green);
      line-height: 1.2;
    }

    /* Button grid */
    .btn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .nav-btn {
      border: none;
      border-radius: 4px;
      padding: 5px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.15s, transform 0.1s;
      text-decoration: none;
      display: inline-block;
      line-height: 1.6;
    }
    .nav-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
      color: #fff;
    }
    .nav-btn:active { transform: translateY(0); }

    /* Individual button colours matching screenshot */
    .btn-licenses       { background: #f39c12; }  /* amber */
    .btn-bond           { background: #3498db; }  /* blue  */
    .btn-vehicle-lic    { background: #27ae60; }  /* green */
    .btn-vehicles       { background: #e74c3c; }  /* red   */
    .btn-procurement    { background: #8e44ad; }  /* purple*/
  </style>
</head>
<body>

  <div class="statutory-card">
    <!-- Header -->
    <div class="card-header-row">
      <div class="icon-stack">
        <i class="fa fa-user"></i>
        <i class="fa fa-shield-halved"></i>
      </div>
      <div class="card-title">Statutory</div>
    </div>

    <!-- Navigation Buttons -->
    <div class="btn-grid">
      <a href="bond-list.html"      class="nav-btn btn-licenses">Licenses</a>
      <a href="bond-dashboard.html" class="nav-btn btn-bond">Bond</a>
      <a href="#"                   class="nav-btn btn-vehicle-lic">Vehicle Licenses</a>
      <a href="#"                   class="nav-btn btn-vehicles">Vehicles</a>
      <a href="#"                   class="nav-btn btn-procurement">Procurement</a>
    </div>
  </div>

</body>
</html>
